name: Build base image

# Builds and pushes ghcr.io/astdyn/stationeers-base whenever base/ changes
# or when the upstream ubuntu:26.04 image is updated. After a successful push
# it triggers the downstream server build via workflow_dispatch.

on:
  push:
    branches: [master]
    paths:
      - base/**
  schedule:
    - cron: "0 5 * * *"   # daily, one hour before the server build check
  workflow_dispatch:

env:
  UPSTREAM_IMAGE: ubuntu:26.04
  IMAGE: ghcr.io/astdyn/stationeers-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write   # needed to trigger the downstream workflow

    steps:
      - name: Get upstream base digest
        id: upstream
        run: |
          echo "digest=$(skopeo inspect --no-creds docker://${{ env.UPSTREAM_IMAGE }} | jq -r .Digest)" >> $GITHUB_OUTPUT

      # On scheduled runs, skip if we already built this exact upstream digest.
      - name: Check whether this upstream was already built
        if: github.event_name == 'schedule'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.upstream-built
          key: upstream-${{ steps.upstream.outputs.digest }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "Upstream image unchanged — skipping build."
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'

      - name: Log in to ghcr.io
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./base
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Mark upstream digest as built
        if: steps.decide.outputs.build == 'true' && github.event_name == 'schedule'
        run: touch /tmp/.upstream-built

      - name: Save upstream digest cache
        if: steps.decide.outputs.build == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: /tmp/.upstream-built
          key: upstream-${{ steps.upstream.outputs.digest }}

      - name: Trigger downstream server build
        if: steps.decide.outputs.build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yaml',
              ref: 'master'
            })
